[ModManager]
cmmver=9.2

[ModInfo]
game=LE2
modname=LE2 Black Restoration
moddev=N7SteveMods
moddesc=Native black-crush correction and near-black detail restoration for Mass Effect 2 Legendary Edition.<br><br>Choose one of five install-time shader presets. IPS-SDR Reference is the recommended default. All Black Restoration presets preserve absolute black. The optional Original ME2 Black Crush Fix preset is a conservative legacy emulation and does not use the Black Restoration curve.<br><br>The optional ASI for runtime tuning and hotkeys is distributed separately and is not required.
modver=1.0.0
modsite=https://github.com/N7Steve/LE2BlackRestoration

[CUSTOMDLC]
sourcedirs=DLC_MOD_LE2BlackRestoration
destdirs=DLC_MOD_LE2BlackRestoration
altdlc=((FriendlyName="IPS-SDR - Reference",Description="Recommended default. Balanced near-black restoration for standard SDR LCD/IPS displays.",Condition=COND_MANUAL,ModOperation=OP_ADD_FOLDERFILES_TO_CUSTOMDLC,ModAltDLC=InstallOptions/IPS_SDR_Reference,ModDestDLC=DLC_MOD_LE2BlackRestoration,OptionGroup=DisplayPreset,CheckedByDefault=true),(FriendlyName="IPS-SDR - Stronger Near-Black",Description="Stronger near-black recovery and tonal separation for SDR displays.",Condition=COND_MANUAL,ModOperation=OP_ADD_FOLDERFILES_TO_CUSTOMDLC,ModAltDLC=InstallOptions/IPS_SDR_Stronger,ModDestDLC=DLC_MOD_LE2BlackRestoration,OptionGroup=DisplayPreset),(FriendlyName="OLED/HDR - Reference",Description="Reference tuning for OLED displays and HDR output.",Condition=COND_MANUAL,ModOperation=OP_ADD_FOLDERFILES_TO_CUSTOMDLC,ModAltDLC=InstallOptions/OLED_HDR_Reference,ModDestDLC=DLC_MOD_LE2BlackRestoration,OptionGroup=DisplayPreset),(FriendlyName="OLED/HDR - Stronger Near-Black",Description="Stronger near-black recovery and tonal separation for OLED/HDR displays.",Condition=COND_MANUAL,ModOperation=OP_ADD_FOLDERFILES_TO_CUSTOMDLC,ModAltDLC=InstallOptions/OLED_HDR_Stronger,ModDestDLC=DLC_MOD_LE2BlackRestoration,OptionGroup=DisplayPreset),(FriendlyName="Original ME2 Black Crush Fix - Legacy Emulation",Description="Static legacy-style emulation of the original ME2 black-crush fix. Uses a targeted +0.004 compensation immediately before the Filmic LUT path and does not use the Black Restoration curve. ASI runtime tuning is not available for this preset.",Condition=COND_MANUAL,ModOperation=OP_ADD_FOLDERFILES_TO_CUSTOMDLC,ModAltDLC=InstallOptions/Original_ME2_Black_Crush_Fix_Legacy_Emulation,ModDestDLC=DLC_MOD_LE2BlackRestoration,OptionGroup=DisplayPreset))
