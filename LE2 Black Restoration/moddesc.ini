[ModManager]
cmmver=9.2

[ModInfo]
game=LE2
modname=LE2 Black Restoration
moddev=N7SteveMods
moddesc=Mass Effect 2 Legendary Edition's post-processing can compress its darkest tones, causing subtle near-black shades to collapse into flat black and hiding detail that should remain visible. LE2 Black Restoration applies a targeted correction in the game's native post-processing path, immediately before the Filmic LUT, to restore separation and texture in deep shadows while preserving absolute black and avoiding a global change to exposure, gamma, or contrast.<br><br>Choose one of five output-oriented presets. SDR Reference is recommended for most players. Select an HDR preset only when you will play with HDR enabled in the game on an HDR-capable display with HDR active; these presets were calibrated specifically around the game's active HDR output. In every other configuration, select SDR. The main presets use the modern Black Restoration curve and require no ReShade or ASI.<br><br>This project is inspired by the Original ME2 Black Crush Fix for the classic release of Mass Effect 2. A dedicated Legacy option provides a conservative visual emulation of that historical fix for players who prefer its appearance; it is not presented as an exact shader port to Legendary Edition.<br><br>The optional ASI for advanced runtime tuning, hotkeys, profiles, and comparison controls is distributed separately and is not required.
modver=1.0.0
modsite=https://github.com/N7Steve/LE2BlackRestoration
bannerimagename=banner.png

