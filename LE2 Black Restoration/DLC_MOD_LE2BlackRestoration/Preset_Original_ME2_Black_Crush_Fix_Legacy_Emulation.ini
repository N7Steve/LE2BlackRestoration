; Original ME2 Black Crush Fix - Legacy Emulation
;
; Historical ME2 behavior:
;   vanilla: max(0, InLinearColour - 0.004)
;   fixed:   max(0, InLinearColour)
;
; LE2 does not expose a literal +/-0.004 in the 32 target DXBC shaders.
; This optional static preset therefore uses a narrowly-scoped +0.004
; compensation immediately before the Filmic LUT coordinate scale.
;
; It is intentionally labelled an emulation, not a mathematically certified
; exact port of the original ME2 shader change.
;
; This preset is shader-only and is not representable by the current ASI parameters.
